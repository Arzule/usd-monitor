#:schema node_modules/wrangler/config-schema.json
name = "usd-monitor"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Dashboard estático servido por el mismo Worker. Las rutas dinámicas pasan
# primero por el Worker; todo lo demás lo sirve el binding de assets.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/admin/*"]

# Creada por .github/workflows/setup-d1.yml. El id no es secreto.
[[d1_databases]]
binding = "DB"
database_name = "usd-monitor"
database_id = "3659826b-26e1-4b28-abd1-e018acf616a9"
migrations_dir = "migrations"

# Cron Triggers (UTC). El plan Free permite 5 por cuenta; usamos 2 en total.
# BCRP: cada hora en días hábiles (debe coincidir con CRON_BCRP en src/index.ts).
[triggers]
crons = ["0 * * * MON-FRI"]

[observability]
enabled = true

[vars]
TWELVE_DATA_SYMBOL = "USD/PEN"
