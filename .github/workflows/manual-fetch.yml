# Lectura forzada en producción vía el endpoint admin protegido.
# ADMIN_TOKEN está guardado como secret de GitHub y como secret del Worker.
name: manual-fetch

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Qué leer"
        type: choice
        options: [live+bcrp, live, bcrp, bcrp-backfill]
        default: live+bcrp

permissions:
  contents: read

concurrency:
  group: manual-fetch
  cancel-in-progress: false

env:
  PROD_URL: https://usd-monitor.gcs14.workers.dev

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /admin/fetch
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -uo pipefail
          if [ -z "${ADMIN_TOKEN}" ]; then echo "::error::Falta el secret ADMIN_TOKEN"; exit 1; fi
          # "live+bcrp" = versión de prueba: UNA lectura de Twelve Data y una del BCRP.
          IFS='+' read -ra sources <<<"${SOURCE}"
          ok=1
          for s in "${sources[@]}"; do
            rm -f out.json
            code=$(curl -sS -m 60 -o out.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              "${PROD_URL}/admin/fetch?source=${s}" || true)
            echo "${s}: HTTP ${code}"
            jq . out.json 2>/dev/null || cat out.json 2>/dev/null || true
            {
              echo "## manual-fetch: \`${s}\` → HTTP ${code}"
              echo '```json'
              jq . out.json 2>/dev/null || cat out.json 2>/dev/null || echo "(sin respuesta)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            [ "${code}" = "200" ] || ok=0
          done
          [ "$ok" = 1 ]
