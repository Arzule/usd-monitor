# Despliegue a producción en cada push a main:
# verificación → migraciones D1 → deploy (con secrets) → smoke test → rollback si falla.
# La salida de wrangler se filtra para no publicar datos de la cuenta en los logs.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos deploys a la vez; tampoco se cancela uno en curso (podría dejar migraciones a medias).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROD_URL: https://usd-monitor.gcs14.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_dispatch permite elegir rama: solo main puede desplegar a producción.
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ env.PROD_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # HEAD^ = commit que estaba desplegado: su smoke.sh valida la versión restaurada.
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck y tests
        run: |
          npm run typecheck
          npm test

      - name: Migraciones D1 remotas
        run: |
          set -uo pipefail
          npx wrangler d1 migrations apply DB --remote > "$RUNNER_TEMP/migrations.log" 2>&1
          rc=$?
          bash scripts/redact-log.sh "$RUNNER_TEMP/migrations.log"
          exit "$rc"

      - name: Versión activa previa
        id: prev
        run: |
          set -uo pipefail
          # Solo "has no deployments" o Worker inexistente (10007) cuentan como primer deploy.
          # Cualquier otro error, o no encontrar una versión al 100 %, detiene el deploy:
          # no se despliega sin saber a qué versión volver.
          if out="$(npx wrangler deployments status --json 2>"$RUNNER_TEMP/prev.err")"; then
            prev="$(jq -r '[.versions[]? | select(.percentage == 100) | .version_id][0] // empty' <<<"$out")"
            if [ -z "$prev" ]; then
              echo "::error::No se encontró una versión activa al 100 %; no se despliega sin rollback posible"
              exit 1
            fi
          elif grep -qE "has no deployments|code: 10007" "$RUNNER_TEMP/prev.err"; then
            prev=""
          else
            bash scripts/redact-log.sh "$RUNNER_TEMP/prev.err"
            echo "::error::No se pudo leer la versión activa"
            exit 1
          fi
          echo "version=${prev}" >> "$GITHUB_OUTPUT"
          echo "Versión previa: ${prev:-ninguna (primer deploy)}"

      - name: Deploy (código + secrets del Worker)
        id: deploy
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PREV: ${{ steps.prev.outputs.version }}
        run: |
          set -uo pipefail
          for name in TWELVE_DATA_API_KEY ADMIN_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Falta el secret de GitHub ${name}"; exit 1; fi
          done
          # Los secrets se suben junto con la versión (--secrets-file), así código y
          # secrets se publican de forma atómica. El archivo vive en RUNNER_TEMP y se borra.
          sf="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$sf"' EXIT
          umask 077
          jq -n --arg twelve "$TWELVE_DATA_API_KEY" --arg admin "$ADMIN_TOKEN" \
            '{TWELVE_DATA_API_KEY: $twelve, ADMIN_TOKEN: $admin}' > "$sf"
          npx wrangler deploy --secrets-file "$sf" \
            --message "deploy ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})" > "$RUNNER_TEMP/deploy.log" 2>&1
          rc=$?
          bash scripts/redact-log.sh "$RUNNER_TEMP/deploy.log"
          # Se publica el Version ID aunque wrangler falle después (p. ej. al registrar
          # los crons): si la versión quedó activa, el smoke y el rollback deben correr.
          version="$(grep -oE 'Current Version ID: [0-9a-f-]+' "$RUNNER_TEMP/deploy.log" | awk '{print $4}' || true)"
          if [ -z "$version" ]; then
            # wrangler activa la versión antes de registrar los crons y solo imprime el ID
            # al final: si falló a mitad, se consulta qué versión quedó activa.
            active="$(npx wrangler deployments status --json 2>/dev/null \
              | jq -r '[.versions[]? | select(.percentage == 100) | .version_id][0] // empty' || true)"
            if [ -n "$active" ] && [ "$active" != "$PREV" ]; then
              echo "::warning::No se leyó el Version ID de la salida; versión activa según la API: ${active}"
              version="$active"
            fi
          fi
          if [ "$rc" -eq 0 ] && [ -z "$version" ]; then
            echo "::error::Deploy OK pero no se pudo determinar la versión desplegada (sin smoke ni rollback): revisar a mano"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Smoke test
        id: smoke
        if: ${{ !cancelled() && steps.deploy.outputs.version != '' }}
        run: bash scripts/smoke.sh "$PROD_URL" "$RUNNER_TEMP/smoke.md"

      - name: Rollback a la versión previa
        id: rollback
        if: >-
          failure() && steps.prev.outputs.version != '' && steps.deploy.outputs.version != '' &&
          (steps.smoke.outcome == 'failure' || steps.deploy.outcome == 'failure')
        env:
          PREV: ${{ steps.prev.outputs.version }}
        run: |
          set -uo pipefail
          npx wrangler rollback "$PREV" --yes \
            --message "auto-rollback: deploy o smoke test fallaron (run ${GITHUB_RUN_ID})" > "$RUNNER_TEMP/rollback.log" 2>&1
          rc=$?
          bash scripts/redact-log.sh "$RUNNER_TEMP/rollback.log"
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "Re-ejecutando smoke test contra la versión restaurada"
          # Se usa el smoke.sh de la versión previa: el del commit nuevo puede exigir
          # endpoints que la versión restaurada todavía no tiene.
          if git show HEAD^:scripts/smoke.sh > "$RUNNER_TEMP/smoke-prev.sh" 2>/dev/null; then
            bash "$RUNNER_TEMP/smoke-prev.sh" "$PROD_URL" "$RUNNER_TEMP/smoke-after-rollback.md"
          else
            SMOKE_CHECKS="health home" bash scripts/smoke.sh "$PROD_URL" "$RUNNER_TEMP/smoke-after-rollback.md"
          fi

      - name: Resumen
        if: always()
        env:
          PREV: ${{ steps.prev.outputs.version }}
          NEW: ${{ steps.deploy.outputs.version }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          {
            echo "## Deploy a producción"
            echo "- URL: ${PROD_URL}"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Versión desplegada: \`${NEW:-—}\` (deploy: ${DEPLOY})"
            echo "- Versión previa: \`${PREV:-ninguna (primer deploy)}\`"
            echo
            echo "### Smoke test (${SMOKE})"
            cat "$RUNNER_TEMP/smoke.md" 2>/dev/null || echo "No se ejecutó."
            if [ -z "$NEW" ] && [ "$DEPLOY" = "failure" ]; then
              echo
              echo "### ❌ El deploy falló antes de publicar una versión: producción no cambió."
            elif [ "$SMOKE" = "failure" ] || [ "$DEPLOY" = "failure" ]; then
              echo
              if [ -z "$PREV" ]; then
                echo "### ❌ Falló el primer deploy: no hay versión previa, sin rollback."
              elif [ "$ROLLBACK" = "success" ]; then
                echo "### ⏪ Rollback a \`${PREV}\` completado; la versión previa responde correctamente"
                cat "$RUNNER_TEMP/smoke-after-rollback.md" 2>/dev/null
              else
                echo "### 🚨 Rollback a \`${PREV}\` FALLÓ (${ROLLBACK}): revisar producción manualmente"
                cat "$RUNNER_TEMP/smoke-after-rollback.md" 2>/dev/null
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
