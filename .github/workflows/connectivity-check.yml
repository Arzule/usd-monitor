name: connectivity-check

# Fase 0: valida las dependencias externas sin escribir código de la app.
# Reglas: nunca imprimir la API key ni datos personales de la cuenta (el repo es público).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  twelve-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Twelve Data /quote USD/PEN (1 crédito)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TWELVE_DATA_API_KEY}" ]; then echo "::error::TWELVE_DATA_API_KEY vacío"; exit 1; fi
          http_code=$(curl -sS -m 20 -o body.json -w '%{http_code}' \
            -H "Authorization: apikey ${TWELVE_DATA_API_KEY}" \
            "https://api.twelvedata.com/quote?symbol=USD/PEN")
          echo "status=${http_code}"
          if [ "${http_code}" != "200" ] || ! jq -e . body.json >/dev/null 2>&1; then
            echo "::error::Twelve Data respondió HTTP ${http_code} o un cuerpo no JSON"; exit 1
          fi
          if [ "$(jq -r '.status // "ok"' body.json)" = "error" ]; then
            echo "::error::Twelve Data error code=$(jq -r '.code' body.json): $(jq -r '.message' body.json)"; exit 1
          fi
          symbol=$(jq -r '.symbol' body.json)
          close=$(jq -r '.close' body.json)
          # last_quote_at = hora de la última cotización; timestamp = inicio de la vela diaria.
          at=$(jq -r '.last_quote_at // .timestamp' body.json)
          rm -f body.json
          if [ "${symbol}" != "USD/PEN" ] || ! [[ "${close}" =~ ^[0-9]+(\.[0-9]+)?$ ]] || ! [[ "${at}" =~ ^[0-9]+$ ]]; then
            echo "::error::Respuesta inválida para USD/PEN"; exit 1
          fi
          echo "precio=${close}"
          echo "hora=$(date -u -d @"${at}" '+%Y-%m-%dT%H:%M:%SZ')"
          echo "✅ Twelve Data USD/PEN OK"

  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.166.0
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Token válido y Account ID accesible
        # No se usa `wrangler whoami`: imprime el email de la cuenta en logs públicos.
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID vacío"; exit 1
          fi
          api() { curl -sS -m 20 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4$1"; }
          token_status=$(api /user/tokens/verify | jq -r '.result.status // "invalid"')
          echo "token=${token_status}"
          [ "${token_status}" = "active" ] || { echo "::error::Token de Cloudflare no activo"; exit 1; }
          ok=$(api "/accounts/${CLOUDFLARE_ACCOUNT_ID}" | jq -r '.success')
          [ "${ok}" = "true" ] || { echo "::error::El token no accede al Account ID configurado"; exit 1; }
          echo "✅ Token y Account ID OK"
      - name: wrangler d1 list (valida permiso D1)
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 list --json > d1.json
          echo "Bases D1 visibles: $(jq 'length' d1.json)"
          jq -r '.[] | "- \(.name) (\(.uuid))"' d1.json
          echo "✅ Permiso D1 OK"
      - name: Subdominio workers.dev
        run: |
          set -euo pipefail
          resp=$(curl -sS -m 20 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")
          sub=$(echo "$resp" | jq -r '.result.subdomain // empty')
          if [ "$(echo "$resp" | jq -r '.success')" = "true" ] && [ -n "$sub" ]; then
            echo "✅ Subdominio workers.dev registrado"
          elif echo "$resp" | jq -e '.errors[]? | select(.code == 10007)' >/dev/null; then
            echo "::warning::Sin subdominio workers.dev: abre Workers & Pages en el panel de Cloudflare para crearlo"
          else
            echo "::error::Error consultando el subdominio: $(echo "$resp" | jq -c '[.errors[]?.code]')"; exit 1
          fi

  bcrp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: BCRP PD04637PD (compra) / PD04638PD (venta)
        run: |
          set -euo pipefail
          start=$(date -u -d '30 days ago' +%Y-%m-%d); end=$(date -u +%Y-%m-%d)
          http_code=$(curl -sS -m 30 -o bcrp.json -w '%{http_code}' \
            "https://estadisticas.bcrp.gob.pe/estadisticas/series/api/PD04637PD-PD04638PD/json/${start}/${end}")
          echo "status=${http_code}"
          if [ "${http_code}" != "200" ] || ! jq -e '.periods | length > 0' bcrp.json >/dev/null 2>&1; then
            echo "::error::BCRP sin datos (HTTP ${http_code})"; exit 1
          fi
          last=$(jq -c '[.periods[] | select(.values[0] != "n.d." and .values[1] != "n.d.")] | last' bcrp.json)
          [ "${last}" != "null" ] || { echo "::error::BCRP sin valores numéricos en 30 días"; exit 1; }
          echo "series: $(jq -r '[.config.series[].name] | join(" | ")' bcrp.json)"
          echo "última fecha con dato: $(echo "$last" | jq -r '.name') compra=$(echo "$last" | jq -r '.values[0]') venta=$(echo "$last" | jq -r '.values[1]')"
          echo "valores n.d. en el rango: $(jq '[.periods[].values[] | select(. == "n.d.")] | length' bcrp.json)"
          echo "✅ BCRP OK"
