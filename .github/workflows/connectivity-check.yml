name: connectivity-check

# Fase 0: valida las dependencias externas sin escribir código de la app.
# Nunca imprime la API key (se pasa por header y GitHub además la enmascara).
on:
  workflow_dispatch:
  push:
    branches: [chore/connectivity-check]
    paths: [.github/workflows/connectivity-check.yml]

permissions:
  contents: read

jobs:
  twelve-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Twelve Data /quote USD/PEN (1 crédito)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TWELVE_DATA_API_KEY}" ]; then echo "❌ TWELVE_DATA_API_KEY vacío"; exit 1; fi
          http_code=$(curl -sS -o body.json -w '%{http_code}' \
            -H "Authorization: apikey ${TWELVE_DATA_API_KEY}" \
            "https://api.twelvedata.com/quote?symbol=USD/PEN")
          echo "HTTP status: ${http_code}"
          status=$(jq -r '.status // "ok"' body.json)
          if [ "${status}" = "error" ]; then
            echo "❌ Twelve Data error: code=$(jq -r '.code' body.json) message=$(jq -r '.message' body.json)"
            exit 1
          fi
          symbol=$(jq -r '.symbol' body.json)
          close=$(jq -r '.close' body.json)
          ts=$(jq -r '.timestamp' body.json)
          last=$(jq -r '.last_quote_at // empty' body.json)
          open=$(jq -r '.is_market_open' body.json)
          echo "symbol=${symbol}"
          echo "price(close)=${close}"
          echo "timestamp=${ts} ($(date -u -d @"${ts}" '+%Y-%m-%dT%H:%M:%SZ'))"
          [ -n "${last}" ] && echo "last_quote_at=${last} ($(date -u -d @"${last}" '+%Y-%m-%dT%H:%M:%SZ'))"
          echo "is_market_open=${open}"
          if [ "${symbol}" != "USD/PEN" ] || ! [[ "${close}" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "❌ Respuesta inválida para USD/PEN"; exit 1
          fi
          echo "✅ Twelve Data USD/PEN OK"
          rm -f body.json

  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: wrangler whoami (valida token y Account ID)
        run: npx --yes wrangler@4 whoami
      - name: wrangler d1 list (valida permiso D1)
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 list --json > d1.json
          echo "Bases D1 visibles: $(jq 'length' d1.json)"
          jq -r '.[] | "- \(.name) (\(.uuid))"' d1.json
          echo "✅ Permiso D1 OK"
      - name: Subdominio workers.dev
        run: |
          set -euo pipefail
          resp=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")
          sub=$(echo "$resp" | jq -r '.result.subdomain // empty')
          if [ "$(echo "$resp" | jq -r '.success')" = "true" ] && [ -n "$sub" ]; then
            echo "✅ workers.dev subdomain: ${sub}.workers.dev"
          else
            echo "⚠️ Sin subdominio workers.dev registrado: $(echo "$resp" | jq -c '.errors')"
          fi
